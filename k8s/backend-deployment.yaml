apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-elective-backend
  namespace: multi-elective
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-elective-backend
  template:
    metadata:
      labels:
        app: multi-elective-backend
    spec:
      containers:
        - name: backend
          image: sudharsini/multi-elective-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: multi-elective-backend-secret
